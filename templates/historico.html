<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Historical Results - Quick Analysis</title>
    <link rel="stylesheet" href="/static/css/flatpickr.min.css">
    <script src="/static/js/jquery.min.js"></script>
    <script src="/static/js/chart.min.js"></script>
    <script src="/static/js/chartjs-plugin-annotation.min.js"></script>
    <script src="/static/js/chartjs-plugin-datalabels.min.js"></script>
    <script src="/static/js/flatpickr.min.js"></script>
    <style>
        body {font-family: "Segoe UI", sans-serif;background-color: #f4f4f4;margin: 0;padding: 20px;color: #333;}
        h1 {text-align: center;margin-bottom: 24px;font-size: 1.8em;font-weight: 500;}
        .filters {display: flex;flex-wrap: wrap;justify-content: center;gap: 15px;margin-bottom: 18px;}
        .filters input {padding: 10px;font-size: 1em;border-radius: 6px;border: 1px solid #ccc;min-width: 170px;height: 42px;}
        .filters button {padding: 10px 20px;min-width: 150px;height: 42px;background-color: #2E7D32;color: white;font-weight: bold;border: none;border-radius: 6px;cursor: pointer;font-size: 0.95em;transition: background-color 0.3s, transform 0.1s;}
        .filters button#download-btn {background-color: #002060;}
        .filters button:hover {filter: brightness(1.05);transform: scale(1.01);}
        .filters button#download-btn:hover {background-color: #002060;}
        .chart-section {max-width: 1100px;margin: 20px auto 0 auto;background: #fff;border-radius: 10px;padding: 30px 30px 20px 30px;box-shadow: 0 0 16px rgba(0,0,0,0.07);}
        .chart-container {margin-bottom: 46px;}
        .chart-title {text-align: center;margin-bottom: 7px;font-weight: 500;color: #333;letter-spacing: 0.5px;}
        #no-data-msg {text-align: center;margin-top: 50px;color: #aa2323;font-size: 1.15em;font-weight: 500;display: none;}
        #failures-container {max-width: 900px;margin: 34px auto 0 auto;background: #f9f9ff;border-radius: 10px;box-shadow: 0 0 10px rgba(0, 32, 96, 0.08);padding: 20px 20px 6px 20px;display: none;}
        #failures-title {text-align: center;color: #002060;font-weight: 500;letter-spacing: 0.6px;font-size: 1.15em;margin-bottom: 10px;}

        /* NUEVO: container gráfico fallas por hora */
        #hourly-failures-container {max-width: 900px;margin: 18px auto 0 auto;background: #f9f9ff;border-radius: 10px;box-shadow: 0 0 10px rgba(0, 32, 96, 0.08);padding: 20px 20px 10px 20px;display: none;}
        #hourly-failures-title {text-align: center;color: #002060;font-weight: 500;letter-spacing: 0.6px;font-size: 1.10em;margin-bottom: 10px;}

        #filter-banner {
            display:none;
            text-align:center;
            margin: 15px auto;
            padding: 8px 14px;
            max-width: 600px;
            border-radius:6px;
            font-weight:500;
            font-size:0.95em;
            box-shadow:0 2px 6px rgba(0,0,0,0.07);
            position: relative;
        }
        #filter-banner.success {background:#e6ffed; border:1px solid #34a853; color:#0c6b2f;}
        #filter-banner.danger {background:#ffe6e6; border:1px solid #d93025; color:#a3261c;}
        #filter-banner button {
            position: absolute;
            right: 8px;
            top: 6px;
            border:none;
            background:none;
            font-weight:bold;
            cursor:pointer;
        }
        #filter-icon {margin-right:6px;}
        .footer {text-align: center;color: #757575;font-size: 0.9em;margin-top: 60px;}

        /* Overlay loader con fade */
        #loading-overlay {
            display: flex;
            position: fixed;
            top:0; left:0; right:0; bottom:0;
            background: rgba(255,255,255,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        #loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .spinner {
            width: 55px;
            height: 55px;
            border: 6px solid #ccc;
            border-top: 6px solid #4CAF50;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        .input-hint {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-top: -6px;
            margin-bottom: 10px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        #loading-message {
            margin-top: 14px;
            font-size: 1.05em;
            color: #444;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1>Quick Data Analysis</h1>

    <div class="filters">
        <input type="text" id="start-date"
                placeholder="Start (YYYY-MM-DD HH:mm, 24h)"
                title="Use 24-hour time: HH:mm or HH:mm:ss, e.g., 06:00, 22:00">
        <input type="text" id="end-date"
                placeholder="End (YYYY-MM-DD HH:mm, 24h)"
                title="Use 24-hour time: HH:mm or HH:mm:ss, e.g., 06:00, 22:00">
        <input type="text" id="part-filter" placeholder="PartNumber (optional)">
        <button id="analyze-btn">Analyze</button>
        <button id="download-btn">Download CSV</button>
    </div>

    <div class="input-hint" id="time-help">
        ⏱ Time format: <strong>24-hour</strong>.
    </div>

    <div id="no-data-msg">Load a valid dataset and press "Analyze".</div>

    <!-- Filter banner -->
    <div id="filter-banner">
        <span id="filter-icon"></span><span id="filter-label"></span>
        <button id="close-filter">✖</button>
    </div>

    <div class="chart-section" id="charts-area" style="display:none;">
        <div class="chart-container">
            <div class="chart-title">Yield (%) by Date</div>
            <canvas id="yield-date-chart" height="78"></canvas>
        </div>
        <div class="chart-container">
            <div class="chart-title">Average Yield (%) by PN</div>
            <canvas id="yield-part-chart" height="90"></canvas>
        </div>
    </div>

    <div id="failures-container">
        <div id="failures-title"></div>
        <canvas id="failures-chart" height="130"></canvas>
    </div>

    <!-- NUEVO: gráfico fallas por hora -->
    <div id="hourly-failures-container">
        <div id="hourly-failures-title"></div>
        <canvas id="hourly-failures-chart" height="145"></canvas>
    </div>

    <div class="footer">
        &copy; Developed by NTW Test Department.<br><br>
        2025 FA Health Monitor.<br><br>
        <a href="mailto:moises.ramirez1@molex.com" style="color: #00ccff; text-decoration: none;">Contact</a>
    </div>

    <!-- Overlay loader -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-message">Processing...</div>
    </div>

    <script src="/static/js/flatpickr.min.js"></script>
    <script>
    // Fechas por defecto: hoy 06:30 y hoy 22:00
    const today = new Date();
    const startDefault = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 6, 30, 0);
    const endDefault   = new Date(today.getFullYear(), today.getMonth(), today.getDate(), 22, 0, 0);

    flatpickr("#start-date", {
        enableTime: true,
        time_24hr: true,
        dateFormat: "Y-m-d H:i",
        minuteIncrement: 1,
        defaultDate: startDefault,
        defaultHour: 6,
        defaultMinute: 30
    });

    flatpickr("#end-date", {
        enableTime: true,
        time_24hr: true,
        dateFormat: "Y-m-d H:i",
        minuteIncrement: 1,
        defaultDate: endDefault,
        defaultHour: 22,
        defaultMinute: 0
    });

    let filteredData = [];
    let yieldDateChart = null, yieldPartChart = null, failuresChart = null;
    let hourlyFailuresChart = null; // NUEVO
    let currentFilterDate = null;

    function showLoader(msg="Procesando...") {
        document.getElementById("loading-message").textContent = msg;
        document.getElementById("loading-overlay").classList.add("active");
    }
    function hideLoader() {
        document.getElementById("loading-overlay").classList.remove("active");
    }

    function generarColores(count, alpha=0.85) {

        const start = { r: 0,   g: 32,  b: 96  };  // Azul NTW profundo
        const end   = { r: 120, g: 144, b: 156 };  // Gris azulado acero

        let colores = [];

        for (let i = 0; i < count; i++) {

            const ratio = count === 1 ? 0 : i / (count - 1);

            const r = Math.round(start.r + ratio * (end.r - start.r));
            const g = Math.round(start.g + ratio * (end.g - start.g));
            const b = Math.round(start.b + ratio * (end.b - start.b));

            colores.push(`rgba(${r},${g},${b},${alpha})`);
        }

        return colores;
    }

    // Analyze
    document.getElementById("analyze-btn").addEventListener("click", () => {
        showLoader("Consulting DB...");
        fetch("/fetch_historico_data", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                start_date: document.getElementById("start-date").value,
                end_date: document.getElementById("end-date").value,
                part_number: document.getElementById("part-filter").value.trim()
            })
        })
        .then(res => res.json())
        .then(data => {
            hideLoader();
            filteredData = data;

            const partFilter = document.getElementById("part-filter").value.trim();
            if (partFilter) {
                filteredData = filteredData.filter(r => (r["PartNumber"] || "").trim() === partFilter);
            }

            if (!filteredData.length) {
                document.getElementById("no-data-msg").textContent = "No data for the applied filters.";
                document.getElementById("no-data-msg").style.display = "block";
                document.getElementById("charts-area").style.display = "none";
                document.getElementById("failures-container").style.display = "none";
                document.getElementById("hourly-failures-container").style.display = "none";
                return;
            }

            document.getElementById("no-data-msg").style.display = "none";
            document.getElementById("charts-area").style.display = "block";
            document.getElementById("failures-container").style.display = "none";
            document.getElementById("hourly-failures-container").style.display = "none";

            renderDateChart(filteredData);
        })
        .catch(err => {
            hideLoader();
            console.error("[ERROR]", err);
            alert("Error fetching data");
        });
    });

    // Download CSV
    document.getElementById("download-btn").addEventListener("click", () => {
        showLoader("Exporting to CSV file...");
        const start = document.getElementById("start-date").value;
        const end = document.getElementById("end-date").value;
        const part = document.getElementById("part-filter").value.trim();
        const url = `/download_csv?start_date=${encodeURIComponent(start)}&end_date=${encodeURIComponent(end)}&part_number=${encodeURIComponent(part)}`;

        setTimeout(() => {
            window.open(url, "_blank");
            hideLoader();
        }, 1200);
    });

    // Yield por fecha con forecast + tooltips mejorados + trendline
    function renderDateChart(data) {
        const byDate = {};
        data.forEach(row => {
            const d = row["TestDate"];
            if (!d) return;
            if (!byDate[d]) byDate[d] = { passed:0, total:0 };
            byDate[d].total++;
            if ((row["TestResult"]||"").toUpperCase() === "PASS") byDate[d].passed++;
        });

        const dateLabels = Object.keys(byDate).sort();
        const yieldByDate = dateLabels.map(d => (byDate[d].passed/byDate[d].total)*100);

        const n = dateLabels.length;
        let forecastLabels = [];
        let forecastY = [];

        let slope = 0;
        let intercept = (yieldByDate[0] ?? 0);

        if (n >= 2) {
            const xVals = dateLabels.map((_,i)=>i);
            const meanX = xVals.reduce((a,b)=>a+b,0)/n;
            const meanY = yieldByDate.reduce((a,b)=>a+b,0)/n;

            let num=0, den=0;
            for(let i=0;i<n;i++){
                num += (xVals[i]-meanX) * (yieldByDate[i]-meanY);
                den += (xVals[i]-meanX) ** 2;
            }
            slope = den !== 0 ? (num/den) : 0;
            intercept = meanY - slope*meanX;

            const forecastDays=7;
            forecastLabels = Array.from({length: forecastDays}, (_, i) => `F+${i+1}`);
            forecastY = forecastLabels.map((_,i)=>Math.min(100, Math.max(0, intercept + slope*(n+i))));
        } else {
            forecastLabels = Array.from({length: 7}, (_, i) => `F+${i+1}`);
            forecastY = [];
        }

        const trendHist = (n >= 2)
            ? Array.from({length: n}, (_, i) => Math.min(100, Math.max(0, intercept + slope*i)))
            : Array(n).fill(null);

        const valuesAll = [...yieldByDate, ...forecastY].filter(v => Number.isFinite(v));
        let yMin = 0, yMax = 100, tickStep = 1;

        if (valuesAll.length >= 1) {
            const dataMin = Math.min(...valuesAll);
            const dataMax = Math.max(...valuesAll);
            const span = Math.max(2, dataMax - dataMin);
            const pad  = Math.max(1, span * 0.15);

            yMin = Math.max(0, dataMin - pad);
            yMax = Math.min(100, dataMax + pad);

            const target = 96;
            yMin = Math.min(yMin, target - 0.5);
            yMax = Math.max(yMax, target + 0.5);
            yMin = Math.floor(yMin * 10) / 10;
            yMax = Math.ceil(yMax * 10) / 10;
            tickStep = span > 20 ? 5 : span > 10 ? 2 : span > 5 ? 1 : 0.5;
        }

        if (yieldDateChart) yieldDateChart.destroy();

        yieldDateChart = new Chart(document.getElementById('yield-date-chart'), {
            type: 'line',
            data: {
                labels: [...dateLabels, ...forecastLabels],
                datasets: [
                    {
                        label:'Yield %',
                        data:[...yieldByDate, ...Array(forecastLabels.length).fill(null)],
                        borderWidth:2,
                        borderColor:'rgba(0,32,96,0.45)',
                        backgroundColor:'rgba(0,32,96,0.05)',
                        tension:0.18,

                        pointRadius: 2.5,
                        pointHoverRadius: 4,
                        pointBackgroundColor: 'rgba(0,32,96,0.35)',
                        pointBorderColor: 'rgba(0,32,96,0.35)',
                        pointBorderWidth: 1,
                        pointHitRadius: 10
                    },
                    {
                        label:'Forecast',
                        data: n >= 2
                            ? [...Array(dateLabels.length-1).fill(null), yieldByDate[yieldByDate.length-1], ...forecastY]
                            : Array(dateLabels.length + forecastLabels.length).fill(null),
                        borderWidth:2,
                        borderColor:'rgba(192,192,192,0.9)',
                        borderDash:[6,6],
                        tension:0.13,
                        pointRadius:4,
                        pointBackgroundColor:'rgba(192,192,192,1)'
                    },
                    {
                        label:'Trendline',
                        data:[...trendHist, ...Array(forecastLabels.length).fill(null)],
                        borderWidth:2.6,
                        borderColor:'rgba(0,0,0,0.78)',
                        borderDash:[4,4],
                        tension:0,
                        pointRadius:0
                    }
                ]
            },
            options: {
                responsive:true,
                plugins:{
                    tooltip:{
                        callbacks:{
                            label: ctx => {
                                const labelText = ctx.label || "";
                                const yVal = ctx.parsed?.y;
                                const isForecast = labelText.startsWith("F+");

                                if (!isForecast && ctx.dataset.label === 'Yield %') {
                                    const passed = byDate[labelText]?.passed ?? '-';
                                    const total = byDate[labelText]?.total ?? '-';
                                    return [
                                        `Yield: ${Number.isFinite(yVal) ? yVal.toFixed(1) : '—'} %`,
                                        `Pass: ${passed} / Total: ${total}`
                                    ];
                                } else if (ctx.dataset.label === 'Forecast') {
                                    return `Forecast: ${Number.isFinite(yVal) ? yVal.toFixed(1) : '—'} %`;
                                } else if (ctx.dataset.label === 'Trendline') {
                                    return `Trendline: ${Number.isFinite(yVal) ? yVal.toFixed(1) : '—'} %`;
                                }
                                return null;
                            }
                        }
                    },
                    annotation:{
                        annotations:{
                            targetLine:{
                                type:'line', yMin:96, yMax:96,
                                borderColor:'rgba(0,150,0,0.8)', borderWidth:2, borderDash:[6,6],
                                label:{enabled:true, content:'Target 96%', position:'end', yAdjust:15,
                                    backgroundColor:'rgba(0,150,0,0.1)', color:'rgba(0,120,0,1)', font:{weight:'bold'}}
                            }
                        }
                    }
                },
                scales:{
                    y:{
                        beginAtZero:false,
                        min: yMin,
                        max: yMax,
                        ticks:{
                            stepSize: tickStep,
                            callback: (v) => {
                                const showDecimals = (yMax - yMin) <= 5;
                                return showDecimals ? `${v.toFixed(1)}%` : `${v}%`;
                            }
                        },
                        grid:{ drawBorder:false }
                    }
                }
            }
        });

        // Click filtra (ignora forecast)
        yieldDateChart.canvas.onclick = evt => {
            const points = yieldDateChart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
            if (!points.length) return;
            const label = yieldDateChart.data.labels[points[0].index] || "";
            if (label.startsWith("F+")) return;
            if (!dateLabels.includes(label)) return;

            currentFilterDate = label;
            const filtered = filteredData.filter(r => r["TestDate"] === label);
            const pass = filtered.filter(r => (r["TestResult"]||"").toUpperCase()==="PASS").length;
            const avgYield = (pass/filtered.length)*100;

            renderPartChart(filtered);
            document.getElementById("failures-container").style.display = "none";
            document.getElementById("hourly-failures-container").style.display = "none";

            const banner = document.getElementById("filter-banner");
            banner.style.display = "block";
            banner.classList.remove("success","danger");
            if (avgYield >= 96) {
                banner.classList.add("success");
                document.getElementById("filter-icon").textContent = "✅";
            } else {
                banner.classList.add("danger");
                document.getElementById("filter-icon").textContent = "⚠️";
            }
            document.getElementById("filter-label").textContent =
                `Filter: ${label} (${filtered.length} rows, Avg Yield: ${avgYield.toFixed(1)}%)`;
        };

        // Double click limpia filtro
        yieldDateChart.canvas.ondblclick = () => {
            currentFilterDate = null;
            renderPartChart(filteredData);
            document.getElementById("filter-banner").style.display = "none";
            document.getElementById("failures-container").style.display = "none";
            document.getElementById("hourly-failures-container").style.display = "none";
        };

        renderPartChart(filteredData);
    }

    // Yield por PN
    function renderPartChart(data) {
        const byPart = {};
        data.forEach(row => {
            const p = row["PartNumber"];
            if (!p) return;
            if (!byPart[p]) byPart[p] = { passed:0, total:0 };
            byPart[p].total++;
            if ((row["TestResult"]||"").toUpperCase() === "PASS") byPart[p].passed++;
        });

        let partData = Object.entries(byPart)
            .map(([k,v]) => ({part:k,yield:(v.passed/v.total)*100,total:v.total}))
            .sort((a,b)=>a.yield-b.yield);

        const partLabels = partData.map(p=>p.part);
        const yieldByPart = partData.map(p=>p.yield);

        if (yieldPartChart) yieldPartChart.destroy();
        yieldPartChart = new Chart(document.getElementById('yield-part-chart'), {
            type: 'bar',
            data: {
                labels: partLabels,
                datasets:[{
                    label:'Yield %',
                    data:yieldByPart,
                    borderWidth:2.1,
                    borderRadius:11,
                    borderSkipped:false,
                    borderColor:'rgba(0,32,96,0.93)',
                    backgroundColor:generarColores(partLabels.length, 0.19),
                    maxBarThickness:46
                }]
            },
            options: {
                responsive:true,
                plugins:{
                    tooltip:{
                        callbacks:{
                            label: ctx => {
                                const p = partData[ctx.dataIndex];
                                const passed = Math.round(p.total * p.yield / 100);
                                return [`Yield: ${ctx.parsed.y.toFixed(1)} %`, `Pass: ${passed} / Total: ${p.total}`];
                            }
                        }
                    }
                },
                scales:{y:{min:0,max:100}}
            }
        });

        document.getElementById('yield-part-chart').onclick = evt => {
            const points = yieldPartChart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
            if (!points.length) return;
            const pn = partLabels[points[0].index];
            mostrarGraficaFallas(pn, data);
        };
    }

    // Fallas (breakdown) + NUEVO: Fallas por hora (stacked)
    function mostrarGraficaFallas(partNumber, dataSet) {
        const data = dataSet.filter(row => row["PartNumber"] === partNumber);
        const failureCount = {};
        let okCount = 0;

        data.forEach(row => {
            const fail = (row["Failure"] || "").trim();
            if (!fail || fail.toUpperCase() === "N/A" || fail.toUpperCase() === "PASS") okCount++;
            else failureCount[fail] = (failureCount[fail] || 0) + 1;
        });

        let pairs = Object.entries(failureCount).map(([l,v]) => ({l,v})).sort((a,b) => b.v - a.v);
        const sortedLabels = pairs.map(p=>p.l);
        const sortedValues = pairs.map(p=>p.v);

        document.getElementById('failures-title').textContent =
            `Failure breakdown for PN "${partNumber}". OK: ${okCount}`;

        if (failuresChart) failuresChart.destroy();
        failuresChart = new Chart(document.getElementById('failures-chart'), {
            type: 'bar',
            data: {
                labels: sortedLabels,
                datasets:[{
                    label:'Quantity',
                    data:sortedValues,
                    borderWidth:2.1,
                    borderRadius:11,
                    borderSkipped:false,
                    borderColor:'rgba(0,32,96,0.80)',
                    backgroundColor:generarColores(sortedLabels.length, 0.22),
                    maxBarThickness:54
                }]
            },
            options: {
                responsive:true,
                plugins:{
                    legend:{display:false},
                    datalabels:{
                        color:'#222',
                        anchor:'end',
                        align:'top',
                        font:{weight:'bold',size:13},
                        formatter:value=>value
                    }
                },
                scales:{
                    x:{title:{display:true,text:"Failure"}},
                    y:{
                        beginAtZero:true,
                        title:{display:true,text:"Quantity"},
                        suggestedMax: sortedValues.length ? (Math.max(...sortedValues)*1.05) : 1
                    }
                }
            },
            plugins:[ChartDataLabels]
        });

        document.getElementById("failures-container").style.display = "block";

        // ✅ NUEVO: render fallas por hora (24 horas fijas)
        renderHourlyFailuresChart(partNumber, data);
    }

    // NUEVO: stacked bar 24h por modo de falla
    function renderHourlyFailuresChart(partNumber, data) {
        if (!data || !data.length) return;

        // ===== OPCIÓN: quitar días completos sin actividad =====
        const REMOVE_EMPTY_DAYS = false; // cámbialo a true si quieres quitar días "en blanco"

        // Filtra por PN si quisieras usarlo desde afuera (si ya mandas data filtrada, ignora)
        // data = data.filter(r => (r["PartNumber"] || "").trim() === partNumber);

        // ===== 1) Fechas únicas =====
        let uniqueDates = [...new Set(data.map(r => (r["TestDate"] || "").trim()).filter(Boolean))].sort();

        if (REMOVE_EMPTY_DAYS) {
            const activityByDate = {};
            data.forEach(r => {
                const d = (r["TestDate"] || "").trim();
                if (!d) return;
                // actividad = al menos un TEST ese día
                activityByDate[d] = (activityByDate[d] || 0) + 1;

                // si quisieras actividad = solo fallas, usa esto en lugar de lo anterior:
                // const f = (r["Failure"] || "").trim();
                // if (f && f.toUpperCase() !== "PASS" && f.toUpperCase() !== "N/A") {
                //   activityByDate[d] = (activityByDate[d] || 0) + 1;
                // }
            });
            uniqueDates = uniqueDates.filter(d => (activityByDate[d] || 0) > 0);
            if (!uniqueDates.length) return;
        }

        // ===== 2) Labels y hourMap (key directo, sin búsquedas) =====
        // label = "MM-DD HH"
        const labels = [];
        const hourMap = {}; // key "YYYY-MM-DD HH" -> { mode: count }

        uniqueDates.forEach(date => {
            for (let h = 0; h < 24; h++) {
                const hourStr = String(h).padStart(2, "0");
                const label = `${date.slice(5)} ${hourStr}`; // MM-DD HH
                labels.push(label);
                hourMap[`${date} ${hourStr}`] = {};
            }
        });

        // ===== 3) Agrupar fallas por fecha+hora =====
        data.forEach(row => {
            const date = (row["TestDate"] || "").trim();
            const hour = (row["TestTime"] || "").slice(0, 2); // "HH"
            const failure = (row["Failure"] || "").trim();

            if (!date || !hour) return;
            if (!failure || failure.toUpperCase() === "PASS" || failure.toUpperCase() === "N/A") return;

            // solo cuenta si esa fecha está dentro de uniqueDates (por si filtraste)
            if (!uniqueDates.includes(date)) return;

            const key = `${date} ${hour}`;
            if (!hourMap[key]) return;

            hourMap[key][failure] = (hourMap[key][failure] || 0) + 1;
        });

        // ===== 4) Modos únicos =====
        const failureModes = [...new Set(
            data
                .map(r => (r["Failure"] || "").trim())
                .filter(f => f && f.toUpperCase() !== "PASS" && f.toUpperCase() !== "N/A")
        )];

        if (!failureModes.length) {
            // si no hay fallas, igual puedes mostrar el chart con todo en 0, o esconderlo
            // aquí lo escondo:
            document.getElementById("hourly-failures-container").style.display = "none";
            return;
        }

        const colors = generarColores(failureModes.length, 0.85);

        // ===== 5) Datasets (sin find) =====
        const datasets = failureModes.map((mode, idx) => ({
            label: mode,
            data: uniqueDates.flatMap(date => {
                return Array.from({ length: 24 }, (_, h) => {
                    const hourStr = String(h).padStart(2, "0");
                    const key = `${date} ${hourStr}`;
                    return (hourMap[key] && hourMap[key][mode]) ? hourMap[key][mode] : 0;
                });
            }),
            backgroundColor: colors[idx],
            borderWidth: 0,
            borderRadius: 0,
            stack: 'stack1'
        }));

        // ===== 6) Separadores por día + etiqueta arriba =====
        const dayBreakAnnotations = {};
        uniqueDates.forEach((date, idx) => {
            const startIndex = idx * 24;         // primer barra del día
            const endIndex = startIndex + 23;    // última barra del día

            // Etiqueta del día al centro del bloque
            dayBreakAnnotations[`dayLabel_${idx}`] = {
                type: 'label',
                xValue: startIndex + 11.5, // centro aprox
                yValue: 0,                 // el plugin lo posiciona relativo; ajustamos con yAdjust
                backgroundColor: 'rgba(0,32,96,0.08)',
                borderColor: 'rgba(0,32,96,0.22)',
                borderWidth: 1,
                color: 'rgba(0,32,96,0.95)',
                content: `${date.slice(5)}`, // "MM-DD"
                font: { weight: 'bold' },
                padding: 6,
                yAdjust: -22, // sube etiqueta
                textAlign: 'center'
            };

            // Línea vertical al inicio de cada día (excepto el primero)
            if (idx > 0) {
                dayBreakAnnotations[`dayBreak_${idx}`] = {
                    type: 'line',
                    xMin: startIndex - 0.5,
                    xMax: startIndex - 0.5,
                    borderColor: 'rgba(0,0,0,0.18)',
                    borderWidth: 1
                };
            }

            // (opcional) sombreado por día alternado para que se lea rápido
            if (idx % 2 === 1) {
                dayBreakAnnotations[`dayBox_${idx}`] = {
                    type: 'box',
                    xMin: startIndex - 0.5,
                    xMax: endIndex + 0.5,
                    yMin: 0,
                    yMax: 'max',
                    backgroundColor: 'rgba(0,32,96,0.03)',
                    borderWidth: 0
                };
            }
        });

        // ===== 7) Crear Chart =====
        if (hourlyFailuresChart) hourlyFailuresChart.destroy();

        hourlyFailuresChart = new Chart(
            document.getElementById('hourly-failures-chart'),
            {
                type: 'bar',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: {
                            callbacks: {
                                // Title más claro: "YYYY-MM-DD HH:00"
                                title: (items) => {
                                    const label = items?.[0]?.label || "";
                                    // label = "MM-DD HH"
                                    const mmdd = label.slice(0, 5);
                                    const hh = label.slice(6, 8);
                                    // reconstruye el YYYY usando uniqueDates según bloque (índice /24)
                                    const idx = items[0].dataIndex;
                                    const dayIdx = Math.floor(idx / 24);
                                    const yyyyMMdd = uniqueDates[dayIdx] || `????-${mmdd}`;
                                    return `${yyyyMMdd} ${hh}:00`;
                                },
                                label: (ctx) => {
                                    if (!ctx.raw) return null;
                                    return `${ctx.dataset.label}: ${ctx.raw}`;
                                }
                            }
                        },
                        annotation: {
                            annotations: dayBreakAnnotations
                        }
                    },
                    scales: {
                        x: {
                            stacked: true,
                            ticks: {
                                maxRotation: 0,
                                minRotation: 0,
                                autoSkip: false,
                                // ✅ aquí está la magia: mostramos SOLO la hora (00..23)
                                callback: (val, index) => {
                                    const h = index % 24;
                                    return String(h).padStart(2, "0");
                                }
                            },
                            grid: {
                                // grid vertical suave para separar horas sin ensuciar
                                color: (ctx) => (ctx.tick && (ctx.index % 24 === 0))
                                    ? 'rgba(0,0,0,0.10)'  // inicio de día
                                    : 'rgba(0,0,0,0.04)'
                            }
                        },
                        y: {
                            stacked: true,
                            beginAtZero: true,
                            title: { display: true, text: 'Failure Count' },
                            grid: { color: 'rgba(0,0,0,0.06)' }
                        }
                    }
                }
            }
        );

        document.getElementById("hourly-failures-container").style.display = "block";
    }
    document.getElementById("close-filter").addEventListener("click", () => {
        currentFilterDate = null;
        renderPartChart(filteredData);
        document.getElementById("filter-banner").style.display = "none";
        document.getElementById("failures-container").style.display = "none";
        document.getElementById("hourly-failures-container").style.display = "none";
    });
    </script>
</body>
</html>
