<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Historical Results - Manual Analysis</title>
    <link rel="stylesheet" href="/static/css/flatpickr.min.css">
    <link rel="stylesheet" href="/static/css/datatables.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@1.4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        body {font-family: "Segoe UI", sans-serif;background-color: #f4f4f4;margin: 0;padding: 20px;color: #333;}
        h1 {text-align: center;margin-bottom: 24px;font-size: 1.8em;font-weight: 500;}
        .upload-area {display: flex;justify-content: center;margin-bottom: 18px;}
        .upload-area input[type="file"] {padding: 8px;border-radius: 6px;background: #fff;border: 1px solid #ccc;width: 300px;}
        .filters {display: flex;flex-wrap: wrap;justify-content: center;gap: 15px;margin-bottom: 18px;}
        .filters input {padding: 10px;font-size: 1em;border-radius: 6px;border: 1px solid #ccc;min-width: 170px;height: 42px;}
        .filters button {padding: 10px 20px;min-width: 150px;height: 42px;background-color: #4CAF50;color: white;font-weight: bold;border: none;border-radius: 6px;cursor: pointer;font-size: 0.95em;transition: background-color 0.3s, transform 0.1s;}
        .filters button#download-btn {background-color: #007BFF;}
        .filters button:hover {filter: brightness(1.05);transform: scale(1.01);}
        .filters button#download-btn:hover {background-color: #0056b3;}
        .chart-section {max-width: 1100px;margin: 20px auto 0 auto;background: #fff;border-radius: 10px;padding: 30px 30px 20px 30px;box-shadow: 0 0 16px rgba(0,0,0,0.07);}
        .chart-container {margin-bottom: 46px;}
        .chart-title {text-align: center;margin-bottom: 7px;font-weight: 500;color: #333;letter-spacing: 0.5px;}
        #no-data-msg {text-align: center;margin-top: 50px;color: #aa2323;font-size: 1.15em;font-weight: 500;display: none;}
        #failures-container {max-width: 900px;margin: 34px auto 0 auto;background: #f9f9ff;border-radius: 10px;box-shadow: 0 0 10px rgba(48, 24, 140, 0.04);padding: 20px 20px 6px 20px;display: none;}
        #failures-title {text-align: center;color: #5a189a;font-weight: 500;letter-spacing: 0.6px;font-size: 1.15em;margin-bottom: 10px;}
        #filter-banner {
            display:none;
            text-align:center;
            margin: 15px auto;
            padding: 8px 14px;
            max-width: 600px;
            border-radius:6px;
            font-weight:500;
            font-size:0.95em;
            box-shadow:0 2px 6px rgba(0,0,0,0.07);
            position: relative;
        }
        #filter-banner.success {background:#e6ffed; border:1px solid #34a853; color:#0c6b2f;}
        #filter-banner.danger {background:#ffe6e6; border:1px solid #d93025; color:#a3261c;}
        #filter-banner button {
            position: absolute;
            right: 8px;
            top: 6px;
            border:none;
            background:none;
            font-weight:bold;
            cursor:pointer;
        }
        #filter-icon {margin-right:6px;}
        .footer {text-align: center;color: #757575;font-size: 0.9em;margin-top: 60px;}
    </style>
</head>
<body>
    <h1>Manual Analysis of FA Results</h1>
    <div class="upload-area">
        <input type="file" id="csv-input" accept=".csv">
    </div>
    <div class="filters">
        <input type="text" id="start-date" placeholder="Start date">
        <input type="text" id="end-date" placeholder="End date">
        <input type="text" id="part-filter" placeholder="PartNumber (optional)">
        <button id="analyze-btn">Analyze</button>
        <button id="download-btn">Download CSV</button>
    </div>

    <div id="no-data-msg">Load a valid .csv file and press "Analyze".</div>

    <!-- Filter banner -->
    <div id="filter-banner">
        <span id="filter-icon"></span><span id="filter-label"></span>
        <button id="close-filter">✖</button>
    </div>

    <div class="chart-section" id="charts-area" style="display:none;">
        <div class="chart-container">
            <div class="chart-title">Yield (%) by Date</div>
            <canvas id="yield-date-chart" height="78"></canvas>
        </div>
        <div class="chart-container">
            <div class="chart-title">Average Yield (%) by PN</div>
            <canvas id="yield-part-chart" height="90"></canvas>
        </div>
    </div>
    <div id="failures-container">
        <div id="failures-title"></div>
        <canvas id="failures-chart" height="130"></canvas>
    </div>
    <div class="footer">
        &copy; Developed by NTW Test Department.<br><br>
        2025 FA Health Monitor.<br><br>
        <a href="mailto:moises.ramirez1@molex.com" style="color: #00ccff; text-decoration: none;">Contact</a>
    </div>

    <script src="/static/js/flatpickr.min.js"></script>
    <script>
    flatpickr("#start-date", { dateFormat: "Y-m-d" });
    flatpickr("#end-date", { dateFormat: "Y-m-d" });

    function generarColores(count, alpha=0.19) {
        const base = [
            [33, 64, 154],
            [90, 115, 175],
            [120, 144, 156],
            [67, 160, 71],
            [255, 167, 38],
            [121, 85, 72]
        ];
        let colores = [];
        for (let i = 0; i < count; i++) {
            const [r, g, b] = base[i % base.length];
            colores.push(`rgba(${r},${g},${b},${alpha})`);
        }
        return colores;
    }

    // CSV parser
    function parseCSV(content) {
        const lines = content.split(/\r?\n/).filter(line => line.trim().length);
        const headers = parseCSVRow(lines[0]);
        let data = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = parseCSVRow(lines[i]);
            while (values.length < headers.length) values.push('');
            let obj = {};
            headers.forEach((h, idx) => obj[h.trim()] = (values[idx] || "").trim());
            data.push(obj);
        }
        return data;
    }
    function parseCSVRow(row) {
        const result = [];
        let inQuotes = false, value = '';
        for (let i = 0; i < row.length; i++) {
            const c = row[i];
            if (c === '"') inQuotes = !inQuotes;
            else if (c === ',' && !inQuotes) { result.push(value); value = ''; }
            else value += c;
        }
        result.push(value);
        return result;
    }

    let rawData = [], filteredData = [];
    let yieldDateChart = null, yieldPartChart = null, failuresChart = null;
    let currentFilterDate = null;

    document.getElementById("csv-input").addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                rawData = parseCSV(ev.target.result);
                document.getElementById("no-data-msg").style.display = "none";
                document.getElementById("charts-area").style.display = "none";
                document.getElementById("failures-container").style.display = "none";
                filteredData = [];
                if (yieldDateChart) yieldDateChart.destroy();
                if (yieldPartChart) yieldPartChart.destroy();
                if (failuresChart) failuresChart.destroy();
            } catch {
                rawData = [];
                document.getElementById("no-data-msg").textContent = "Invalid file or wrong format.";
                document.getElementById("no-data-msg").style.display = "block";
            }
        };
        reader.readAsText(file);
    });

    // Analyze button
    document.getElementById("analyze-btn").addEventListener("click", () => {
        if (!rawData.length) {
            document.getElementById("no-data-msg").textContent = "Load a valid .csv file and press 'Analyze'.";
            document.getElementById("no-data-msg").style.display = "block";
            document.getElementById("charts-area").style.display = "none";
            document.getElementById("failures-container").style.display = "none";
            return;
        }
        const start = document.getElementById("start-date").value;
        const end = document.getElementById("end-date").value;
        const part = document.getElementById("part-filter").value.trim();

        filteredData = rawData.filter(row => {
            let dateOk = true, partOk = true;
            if (start) dateOk = (row["TestDate"] && row["TestDate"] >= start);
            if (end) dateOk = dateOk && (row["TestDate"] && row["TestDate"] <= end);
            if (part) partOk = (row["PartNumber"] === part);
            return dateOk && partOk;
        });

        if (!filteredData.length) {
            document.getElementById("no-data-msg").textContent = "No data for the applied filters.";
            document.getElementById("no-data-msg").style.display = "block";
            document.getElementById("charts-area").style.display = "none";
            document.getElementById("failures-container").style.display = "none";
            return;
        }
        document.getElementById("no-data-msg").style.display = "none";
        document.getElementById("charts-area").style.display = "block";
        document.getElementById("failures-container").style.display = "none";
        renderDateChart(filteredData);
    });

    // Render Yield by Date + Forecast
    function renderDateChart(data) {
        const byDate = {};
        data.forEach(row => {
            const d = row["TestDate"];
            if (!d) return;
            if (!byDate[d]) byDate[d] = { passed:0, total:0 };
            byDate[d].total++;
            if ((row["TestResult"]||"").toUpperCase() === "PASS") byDate[d].passed++;
        });
        const dateLabels = Object.keys(byDate).sort();
        const yieldByDate = dateLabels.map(d => (byDate[d].passed/byDate[d].total)*100);

        // Forecast regression
        const n = dateLabels.length;
        const xVals = dateLabels.map((_,i)=>i);
        const yVals = yieldByDate;
        const meanX = xVals.reduce((a,b)=>a+b,0)/n;
        const meanY = yVals.reduce((a,b)=>a+b,0)/n;
        let num=0, den=0;
        for(let i=0;i<n;i++){num+=(xVals[i]-meanX)*(yVals[i]-meanY);den+=(xVals[i]-meanX)**2;}
        const slope=num/den, intercept=meanY - slope*meanX;
        const forecastDays=7;
        const forecastLabels = Array.from({length: forecastDays}, (_, i) => `F+${i+1}`);
        const forecastY = forecastLabels.map((_,i)=>Math.min(100, Math.max(0, intercept + slope*(n+i))));

        let minY = Math.min(...yieldByDate, ...forecastY);
        let maxY = Math.max(...yieldByDate, ...forecastY);
        const margin = (maxY - minY) * 0.15;
        let yMin = Math.max(0, Math.floor(minY - margin));
        let yMax = Math.min(100, Math.ceil(maxY + margin));
        if (yMax > 97 && yMin > 90) { yMin = Math.max(85, minY - 2); yMax = 100; }

        if (yieldDateChart) yieldDateChart.destroy();
        yieldDateChart = new Chart(document.getElementById('yield-date-chart'), {
            type: 'line',
            data: {
                labels: [...dateLabels, ...forecastLabels],
                datasets: [
                    {label:'Yield %',data:[...yieldByDate, ...Array(forecastDays).fill(null)],borderWidth:2,borderColor:'rgba(72,27,179,0.8)',backgroundColor:'rgba(72,27,179,0.1)',tension:0.13,pointRadius:4,pointBackgroundColor:'rgba(72,27,179,0.85)'},
                    {label:'Forecast',data:[...Array(dateLabels.length-1).fill(null), yieldByDate[yieldByDate.length-1], ...forecastY],borderWidth:2,borderColor:'rgba(192,192,192,0.9)',borderDash:[6,6],tension:0.13,pointRadius:4,pointBackgroundColor:'rgba(192,192,192,1)'}
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: ctx => {
                                if (ctx.dataset.label === 'Yield %') {
                                    const date = ctx.label;
                                    const passed = byDate[date]?.passed ?? '-';
                                    const total = byDate[date]?.total ?? '-';
                                    return [`Yield: ${ctx.parsed.y.toFixed(1)} %`, `Pass: ${passed} / Total: ${total}`];
                                } else {
                                    return `Forecast: ${ctx.parsed.y.toFixed(1)} %`;
                                }
                            }
                        }
                    },
                    annotation: {
                        annotations: {
                            targetLine: {
                                type: 'line',
                                yMin: 96, yMax: 96,
                                borderColor: 'rgba(0,150,0,0.8)',
                                borderWidth: 2,
                                borderDash: [6, 6],
                                label: {enabled:true,content:'Target 96%',position:'end',yAdjust:15,backgroundColor:'rgba(0,150,0,0.1)',color:'rgba(0,120,0,1)',font:{weight:'bold'}}
                            }
                        }
                    }
                },
                scales: {x:{title:{display:true,text:"Date"}},y:{min:yMin, max:yMax, grace: '10%',title:{display:true,text:"Yield (%)"}}}
            }
        });

        // click filter
        yieldDateChart.canvas.onclick = evt => {
            const points = yieldDateChart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
            if (!points.length) return;
            const date = yieldDateChart.data.labels[points[0].index];
            if (!dateLabels.includes(date)) return;
            currentFilterDate = date;
            const filtered = filteredData.filter(r=>r["TestDate"]===date);

            const pass = filtered.filter(r => (r["TestResult"]||"").toUpperCase()==="PASS").length;
            const avgYield = (pass/filtered.length)*100;

            renderPartChart(filtered);
            document.getElementById("failures-container").style.display = "none";

            const banner = document.getElementById("filter-banner");
            banner.style.display = "block";
            banner.classList.remove("success","danger");
            if (avgYield >= 96) {
                banner.classList.add("success");
                document.getElementById("filter-icon").textContent = "✅";
            } else {
                banner.classList.add("danger");
                document.getElementById("filter-icon").textContent = "⚠️";
            }
            document.getElementById("filter-label").textContent = `Filter: ${date} (${filtered.length} rows, Avg Yield: ${avgYield.toFixed(1)}%)`;
        };

        // double click clear filter
        yieldDateChart.canvas.ondblclick = () => {
            currentFilterDate = null;
            renderPartChart(filteredData);
            document.getElementById("filter-banner").style.display = "none";
        };

        renderPartChart(filteredData);
    }

    // Yield by PartNumber
    function renderPartChart(data) {
        const byPart = {};
        data.forEach(row => {
            const p = row["PartNumber"];
            if (!p) return;
            if (!byPart[p]) byPart[p] = { passed:0, total:0 };
            byPart[p].total++;
            if ((row["TestResult"]||"").toUpperCase() === "PASS") byPart[p].passed++;
        });
        let partData = Object.entries(byPart).map(([k,v]) => ({part:k,yield:(v.passed/v.total)*100,total:v.total})).sort((a,b)=>a.yield-b.yield);
        const partLabels = partData.map(p=>p.part);
        const yieldByPart = partData.map(p=>p.yield);

        if (yieldPartChart) yieldPartChart.destroy();
        yieldPartChart = new Chart(document.getElementById('yield-part-chart'), {
            type: 'bar',
            data: {labels: partLabels, datasets:[{label:'Yield %',data:yieldByPart,borderWidth:2.1,borderRadius:11,borderSkipped:false,borderColor:'rgba(48,24,140,0.93)',backgroundColor:generarColores(partLabels.length, 0.19),maxBarThickness:46}]},
            options: {responsive:true,plugins:{tooltip:{callbacks:{label: ctx => {
                const p = partData[ctx.dataIndex];
                const passed = Math.round(p.total * p.yield / 100);
                return [`Yield: ${ctx.parsed.y.toFixed(1)} %`, `Pass: ${passed} / Total: ${p.total}`];
            }}}},scales:{x:{title:{display:true,text:"PartNumber"}},y:{min:0,max:100,title:{display:true,text:"Yield (%)"}}}}
        });

        document.getElementById('yield-part-chart').onclick = evt => {
            const points = yieldPartChart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
            if (!points.length) return;
            mostrarGraficaFallas(partLabels[points[0].index], data);
        };
    }

    // Failures chart
    function mostrarGraficaFallas(partNumber, dataSet) {
        const data = dataSet.filter(row => row["PartNumber"] === partNumber);
        const failureCount = {};
        let okCount = 0;
        data.forEach(row => {
            const fail = (row["Failure"] || "").trim();
            if (!fail || fail.toUpperCase() === "N/A" || fail.toUpperCase() === "PASS") okCount++;
            else failureCount[fail] = (failureCount[fail] || 0) + 1;
        });
        let pairs = Object.entries(failureCount).map(([l,v]) => ({l,v})).sort((a,b) => b.v - a.v);
        const sortedLabels = pairs.map(p=>p.l);
        const sortedValues = pairs.map(p=>p.v);

        document.getElementById('failures-title').textContent = `Failure breakdown for PN "${partNumber}". OK: ${okCount}`;

        if (failuresChart) failuresChart.destroy();
        failuresChart = new Chart(document.getElementById('failures-chart'), {
            type: 'bar',
            data: {labels: sortedLabels, datasets:[{label:'Quantity',data:sortedValues,borderWidth:2.1,borderRadius:11,borderSkipped:false,borderColor:'rgba(72,27,179,0.80)',backgroundColor:generarColores(sortedLabels.length, 0.22),maxBarThickness:54}]},
            options: {responsive:true,plugins:{legend:{display:false},datalabels:{color:'#222',anchor:'end',align:'top',font:{weight:'bold',size:13},formatter:value=>value}},scales:{x:{title:{display:true,text:"Failure"}},y:{beginAtZero:true,title:{display:true,text:"Quantity"},suggestedMax: Math.max(...sortedValues)*1.05}}},
            plugins:[ChartDataLabels]
        });
        document.getElementById("failures-container").style.display = "block";
    }

    document.getElementById("download-btn").addEventListener("click", () => {
        window.open("/download_csv", "_blank");
    });

    // Close filter
    document.getElementById("close-filter").addEventListener("click", () => {
        currentFilterDate = null;
        renderPartChart(filteredData);
        document.getElementById("filter-banner").style.display = "none";
    });
    </script>
</body>
</html>
